name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: ./tests/run-tests.sh
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make clean
      - run: make EXTRA="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: ASAN_OPTIONS=detect_leaks=1 EXTRA="-fsanitize=address,undefined" ./tests/run-tests.sh
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/check-docs.sh
